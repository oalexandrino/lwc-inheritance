<template>
    <lightning-modal-header label={modalTitle}></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-p-around_medium">
            <p class="slds-text-body_regular">{modalMessage}</p>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button
            variant="neutral"
            label="Cancel"
            onclick={handleClose}>
        </lightning-button>
        <lightning-button
            variant="brand"
            label={buttonLabel}
            onclick={handleConfirm}>
        </lightning-button>
    </lightning-modal-footer>
</template>
